name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet pour les dates des textes

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Dates des textes à jour
        run: node scripts/doc-dates.mjs --check
      - name: Build
        run: npm run build

      - name: Mise en page mobile (375 px)
        run: |
          npx playwright install --with-deps chromium
          npm run start -- -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 >/dev/null && break; sleep 1; done
          node scripts/check-mobile.mjs http://localhost:3000
